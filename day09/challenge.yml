# yaml-language-server: $schema=https://raw.githubusercontent.com/scott181182/challenge-script/refs/heads/main/challenge.schema.json
name: Advent of Code 2025 - Day 09
command: ["python", "-m", "day09.{{part}}"]
environment:
  PYTHONPATH: ..
parts:
  part1:
    cases:
      test:
        stdin: &test-input
          file: test.txt
        expected:
          stdout: "50"
      input:
        stdin: &real-input
          file: input.txt
        expected:
          stdout: "4786902990"
  part2:
    cases:
      test:
        stdin: *test-input
        expected:
          stdout: "24"
      input:
        stdin: *real-input
        expected:
          stdout: "1571016172"
